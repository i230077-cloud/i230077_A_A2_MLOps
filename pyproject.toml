[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-audit-agent"
version = "1.0.0"
description = "Autonomous AI Agent for DevOps Repository Auditing with Evidence-Based Verification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Muhammad Saad", email = "muhammad.saadd06@gmail.com" }
]
keywords = ["devops", "agent", "llm", "audit", "security", "github-actions", "static-analysis"]
dependencies = [
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "google-genai>=0.1.1",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
devops-auditor = "agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
